showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: RainyunRefreshCert
title: 雨云-更新证书
desc: app.rainyun.com
icon: svg:icon-rainyun
group: cdn
needPlus: false
i18n:
  en-US:
    title: Rainyun - Refresh Cert
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    order: 0
  certDomains:
    title: 当前证书域名
    component:
      name: cert-domains-getter
    mergeScript: |2-

              return {
                component:{
                    inputKey: ctx.compute(({form})=>{
                      return form.cert
                    }),
                }
              }
              
    template: false
    required: false
    order: 0
  accessId:
    title: 雨云授权
    component:
      name: access-selector
      type: rainyun
    required: true
    order: 0
  certList:
    title: 证书Id
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetCertList
      search: false
      pager: false
      single: false
      watches:
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 要更新的rainyun证书id
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-rainyun/plugins/plugin-refresh-cert.js
