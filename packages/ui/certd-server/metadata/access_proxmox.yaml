name: proxmox
title: proxmox
desc: ''
icon: svg:icon-proxmox
i18n:
  en-US:
    title: Proxmox Access
input:
  host:
    title: host
    component:
      placeholder: IP或域名
    required: true
    encrypt: false
  port:
    title: 端口
    component:
      placeholder: 端口
      component:
        name: a-input-number
    required: true
    encrypt: false
  username:
    title: 用户名
    component:
      placeholder: username
    required: true
    encrypt: false
  password:
    title: 密码
    component:
      placeholder: password
    required: true
    encrypt: true
  realm:
    title: 领域
    value: pam
    component:
      placeholder: pam、pve。默认值 pam
    helper: pam 或 pve。默认值 pam
    required: false
    encrypt: false
  testRequest:
    title: 测试
    component:
      name: api-test
      action: onTestRequest
    helper: 点击测试接口看是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-proxmox/access.js
