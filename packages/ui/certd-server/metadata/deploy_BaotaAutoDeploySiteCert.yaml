showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: BaotaAutoDeploySiteCert
title: 宝塔-全自动部署
icon: svg:icon-bt
group: panel
desc: 根据证书域名自动匹配宝塔站点，全自动部署SSL证书。新增加速域名自动感知，自动新增部署
runStrategy: 0
needPlus: true
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    required: true
    order: 0
  certDomains:
    title: 当前证书域名
    component:
      name: cert-domains-getter
    mergeScript: |2-

              return {
                component:{
                    inputKey: ctx.compute(({form})=>{
                      return form.cert
                    }),
                }
              }
              
    template: false
    required: false
    order: 0
  accessId:
    title: 宝塔授权
    helper: 将自动查找证书匹配的站点，检查证书即将过期的站点并更新
    component:
      name: access-selector
      type: baota
    required: true
    order: 0
output:
  deployedList:
    title: 已部署过的站点
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-plus/baota/plugins/plugin-deploy-automatch.js
