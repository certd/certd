showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: DeployCertToTencentCLB
title: 腾讯云-部署到CLB
icon: svg:icon-tencentcloud
group: tencent
desc: 暂时只支持单向认证证书，暂时只支持通用负载均衡
dependPlugins:
  access:tencent: '*'
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
        - UploadCertToTencent
    required: true
    order: 0
  accessId:
    title: Access提供者
    helper: access授权
    component:
      name: access-selector
      type: tencent
    required: true
    order: 0
  region:
    title: 大区
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetRegionList
      search: false
      pager: false
      single: true
      watches:
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 请选择CLB地域
    order: 0
  loadBalancerId:
    title: 负载均衡ID
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetCLBList
      search: false
      pager: false
      single: true
      watches:
        - certDomains
        - accessId
        - region
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 请选择要部署证书的负载均衡
    order: 0
  listenerId:
    title: 监听器ID
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetListenerList
      search: false
      pager: false
      single: true
      watches:
        - certDomains
        - accessId
        - region
        - loadBalancerId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 请选择要部署证书的HTTPS监听器
    order: 0
  domain:
    title: 域名
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetDomainList
      search: false
      pager: false
      single: false
      watches:
        - certDomains
        - accessId
        - region
        - loadBalancerId
        - listenerId
    required: false
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 如果开启了SNI，请选择要部署证书的域名；未开启SNI时可以留空
    order: 0
  certName:
    title: 证书名称前缀
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-tencent/plugin/deploy-to-clb/index.js
