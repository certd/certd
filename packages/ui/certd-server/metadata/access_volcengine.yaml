name: volcengine
title: 火山引擎
desc: ''
icon: svg:icon-volcengine
order: 1
i18n:
  en-US:
    title: Volcengine Access
    desc: Volcengine IAM access.
    input:
      accessKeyId:
        title: Access key ID
        helper: Get credentials from Volcengine IAM
      secretAccessKey:
        title: Secret access key
      testRequest:
        title: Test
        helper: Test whether the credentials are valid
input:
  accessKeyId:
    title: AccessKeyID
    component:
      placeholder: AccessKeyID
    helper: '[获取密钥](https://console.volcengine.com/iam/keymanage/)'
    required: true
  secretAccessKey:
    title: SecretAccessKey
    component:
      placeholder: SecretAccessKey
    required: true
    encrypt: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: onTestRequest
    helper: 点击测试接口看是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-volcengine/access.js
