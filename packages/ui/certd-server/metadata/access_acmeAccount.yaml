name: acmeAccount
title: ACME账号
desc: 用于复用ACME账号私钥和账号地址，证书申请时不再临时创建账号
icon: ph:certificate
subtype: caType
input:
  caType:
    title: 颁发机构
    component:
      name: remote-select
      vModel: value
      type: access
      typeName: acmeAccount
      action: onCaTypeList
      single: true
      mode: tags
      emitImmediate: true
    required: true
    mergeScript: |2-

          return {
            component: {
              disabled: ctx.compute(({form})=> !!form.access?.account),
              on: {
                "selected-change": (scope)=>{
                  // 把选中颁发机构的 needEAB 同步到表单隐藏字段，用于控制 EAB 输入框显隐
                  let form = scope.form || {};
                  form.access._needEAB = scope.$event?.needEAB
                }
              }
            },
          }
          
  email:
    title: 邮箱
    component:
      placeholder: user@example.com
    rules:
      - type: email
        message: 请输入正确的邮箱
    required: true
    mergeScript: |2-

          return {
            component: {
              disabled: ctx.compute(({form})=> !!form.access?.account)
            }
          }
          
  directoryUrl:
    title: ACME Directory URL
    component:
      placeholder: https://your-ca.example.com/directory
    helper: 旧版自定义ACME使用，现已由系统「流水线设置」中的自定义ACME配置管理
    required: false
    mergeScript: |2-

          return {
            show: false,
          }
          
  eabKid:
    title: EAB KID
    component:
      placeholder: 需要EAB的颁发机构生成账号时填写
    helper: >-
      需要提供EAB授权

      ZeroSSL：请前往[zerossl开发者中心](https://app.zerossl.com/developer),生成 'EAB
      Credentials'

      Google:请查看[google获取eab帮助文档](https://certd.docmirror.cn/guide/use/google/),需要你去翻墙得到EAB填到这里

      SSL.com:[SSL.com账号页面](https://secure.ssl.com/account),然后点击api
      credentials链接，然后点击编辑按钮，查看Secret key和HMAC key

      litessl:[litesslEAB页面](https://freessl.cn/automation/eab-manager),然后点击新增EAB
    required: true
    encrypt: true
    mergeScript: |2-

          return {
            show: ctx.compute(({form})=>{
              // 按所选颁发机构的 needEAB 配置显隐（由 caType 的 onSelectedChange 同步到 _needEAB）
              return form.access?._needEAB === true;
            }),
            component: {
              disabled: ctx.compute(({form})=> !!form.access?.account)
            }
          }
          
  eabHmacKey:
    title: EAB HMAC Key
    component:
      placeholder: 需要EAB的颁发机构生成账号时填写
    required: true
    encrypt: true
    mergeScript: |2-

          return {
            show: ctx.compute(({form})=>{
              // 按所选颁发机构的 needEAB 配置显隐（由 caType 的 onSelectedChange 同步到 _needEAB）
              return form.access?._needEAB === true;
            }),
            component: {
              disabled: ctx.compute(({form})=> !!form.access?.account)
            }
          }
          
  account:
    title: 生成ACME账号
    component:
      name: refresh-input
      action: GenerateAccount
      buttonText: 生成ACME账号
      successMessage: ACME账号已生成，请保存授权配置
      type: textarea
      rows: 4
    col:
      span: 24
    required: true
    helper: 请点击右边按钮生成ACME账号，账号一旦生成不允许修改
    encrypt: true
    mergeScript: |2-

          return {
            component: {
              disabled: ctx.compute(({form})=> !!form.access?.account && !form.access?.editAccount)
            }
          }
          
  editAccount:
    title: 修改ACME账号
    component:
      name: a-switch
      vModel: checked
    required: false
    helper: 是否开启修改ACME账号，注意，开启后，会影响DNS持久验证记录
    encrypt: false
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-cert/access/acme-account-access.js
