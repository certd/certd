showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: EsxiDeployCert
title: ESXi-部署证书到ESXi
icon: svg:icon-lucky
group: host
needPlus: true
i18n:
  en-US:
    title: ESXi - Deploy to ESXi
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    required: true
    order: 0
  accessId:
    title: 主机SSH授权
    component:
      name: access-selector
      type: ssh
    required: true
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-plus/esxi/plugin-deploy-to-esxi.js
