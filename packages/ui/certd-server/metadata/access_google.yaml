name: google
title: google cloud
desc: 谷歌云授权
i18n:
  en-US:
    title: Google Cloud
    desc: Google Cloud credentials.
    input:
      type:
        title: Credential Type
        optionsMapping:
          serviceAccount: Service Account Key
          apiKey: API Key (unavailable)
        helper: Credential type.
      projectId:
        title: Project ID
        helper: Project ID
      apiKey:
        title: API Key
        helper: Do not select this option; it is currently unavailable.
      serviceAccountSecret:
        title: Service Account Key
        helper: >-
          [Create a service
          account](https://cloud.google.com/iam/docs/service-accounts-create?hl=en)
          and [create a
          key](https://console.cloud.google.com/iam-admin/serviceaccounts).
          Download the JSON key and paste its contents here.
      httpsProxy:
        title: HTTPS Proxy
        helper: >-
          Google requests may require a proxy. If unset, the global HTTPS_PROXY
          environment variable is used. A proxy is not needed when the server is
          located overseas.
icon: flat-color-icons:google
input:
  type:
    title: 密钥类型
    value: serviceAccount
    component:
      placeholder: 密钥类型
      name: a-select
      vModel: value
      options:
        - value: serviceAccount
          label: 服务账号密钥
        - value: apiKey
          label: ApiKey，暂不可用
          disabled: true
    helper: 密钥类型
    required: true
    encrypt: false
  projectId:
    title: 项目ID
    component:
      placeholder: ProjectId
    helper: ProjectId
    required: true
    encrypt: false
    mergeScript: |2-

          return {
            show:ctx.compute(({form})=>{
              return form.access.type === 'apiKey'
            })
          }
          
  apiKey:
    title: ApiKey
    component:
      placeholder: ApiKey
    helper: 不要选，目前没有用
    required: true
    encrypt: true
    mergeScript: |2-

          return {
            show:ctx.compute(({form})=>{
              return form.access.type === 'apiKey'
            })
          }
          
  serviceAccountSecret:
    title: 服务账号密钥
    component:
      placeholder: serviceAccountSecret
      name: a-textarea
      vModel: value
      rows: 4
    helper: >-
      [如何创建服务账号](https://cloud.google.com/iam/docs/service-accounts-create?hl=zh-CN) 

      [获取密钥](https://console.cloud.google.com/iam-admin/serviceaccounts?hl=zh-cn)，点击详情，点击创建密钥，将下载json文件，把内容填在此处
    required: true
    encrypt: true
    mergeScript: |2-

          return {
            show:ctx.compute(({form})=>{
              return form.access.type === 'serviceAccount'
            })
          }
          
  httpsProxy:
    title: https代理
    component:
      placeholder: http://127.0.0.1:10811
    helper: |-
      Google的请求需要走代理，如果不配置，则会使用环境变量中的全局HTTPS_PROXY配置
      或者服务器本身在海外，则不需要配置
    required: false
    encrypt: false
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-cert/access/google-access.js
