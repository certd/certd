name: ksyun
title: 金山云授权
desc: ''
icon: svg:icon-ksyun
i18n:
  en-US:
    title: Ksyun Access
    desc: Configure Ksyun access credentials.
input:
  accessKeyId:
    title: AccessKeyID
    component:
      placeholder: AccessKeyID
    helper: '[获取密钥](https://uc.console.ksyun.com/pro/iam/#/set/keyManage)'
    required: true
  accessKeySecret:
    title: AccessKeySecret
    component:
      placeholder: AccessKeySecret
    required: true
    encrypt: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: 点击测试接口是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-ksyun/access.js
