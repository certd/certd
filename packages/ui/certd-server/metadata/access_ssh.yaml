name: ssh
title: Host Login Authorization
desc: ''
icon: clarity:host-line
input:
  host:
    title: Host Address
    component:
      placeholder: Host domain or IP address
    required: true
  port:
    title: Port
    value: 22
    component:
      name: a-input-number
      placeholder: '22'
    rules:
      - required: true
        message: This field is required
  username:
    title: Username
    value: root
    rules:
      - required: true
        message: This field is required
  password:
    title: Password
    component:
      name: a-input-password
      vModel: value
    encrypt: true
    helper: A login password or private key is required
  privateKey:
    title: Private Key Login
    helper: A private key or password is required
    component:
      name: pem-input
      vModel: modelValue
    encrypt: true
  passphrase:
    title: Private Key Passphrase
    helper: If your private key has a passphrase
    component:
      name: a-input-password
      vModel: value
    encrypt: true
  scriptType:
    title: Script Type
    helper: bash 、sh 、fish
    component:
      name: a-select
      vModel: value
      options:
        - value: default
          label: Default
        - value: sh
          label: sh
        - value: bash
          label: bash
        - value: fish
          label: fish (set -e is not supported)
  pty:
    title: Pseudo Terminal
    helper: >-
      If login fails with: all authentication methods failed / unable to
      exec, try enabling pseudo-terminal mode for keyboard-interactive login.

      This may affect log output.
    component:
      name: a-switch
      vModel: checked
  socksProxy:
    title: SOCKS Proxy
    helper: 'SOCKS proxy configuration, format: socks5://user:password@host:port'
    component:
      name: a-input
      vModel: value
      placeholder: socks5://user:password@host:port
    encrypt: false
  timeout:
    title: Timeout
    helper: Command execution timeout in seconds, default 30 minutes
    component:
      name: a-input-number
  windows:
    title: Windows
    helper: >-
      Select this for Windows hosts.

      Windows requires [OpenSSH](https://certd.docmirror.cn/guide/use/host/windows.html).
    component:
      name: a-switch
      vModel: checked
  encoding:
    title: Command Encoding
    helper: If this is a Windows host and output is garbled, try GBK
    component:
      name: a-select
      vModel: value
      options:
        - value: ''
          label: Default
        - value: GBK
          label: GBK
        - value: UTF8
          label: UTF-8
  testRequest:
    title: Test
    component:
      name: api-test
      type: access
      typeName: ssh
      action: TestRequest
    mergeScript: |2-

               return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: Click to test
order: 0
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-lib/ssh/ssh-access.js
