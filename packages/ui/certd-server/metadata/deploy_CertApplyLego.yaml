showRunStrategy: false
default:
  strategy:
    runStrategy: 0
  input:
    renewDays: 20
    forceUpdate: false
name: CertApplyLego
icon: ph:certificate
title: 证书申请（Lego）
group: cert
deprecated: 暂时禁用此插件，请使用JS版证书插件生成证书
desc: 支持海量DNS解析提供商，推荐使用，一样的免费通配符域名证书申请，支持多个域名打到同一个证书上
i18n:
  en-US:
    title: Request Certificate (Lego)
    desc: >-
      Recommended. Supports a wide range of DNS providers and requests free
      wildcard certificates with multiple domains in one certificate.
    input:
      domains:
        title: Certificate Domains
        component:
          placeholder: >-
            Enter certificate domains or IPs, e.g. foo.com, *.foo.com,
            *.sub.foo.com, *.bar.com, 123.123.123.123
        helper: |-
          1. Multiple domains can be included in one certificate.
          2. Do not include subdomains already covered by a wildcard.
          3. A wildcard covers only one level.
          4. Enter a domain, press Space, then enter the next one.
          5. Configure delegated subdomain hosting before use if applicable.
      renewDays:
        title: Renewal Window (Days)
      forceUpdate:
        title: Force Renewal
      dnsType:
        title: DNS Provider Type
        helper: >-
          Select the provider that hosts your domain's DNS. See the [Lego DNS
          documentation](https://go-acme.github.io/lego/dns/) for the provider
          name and configuration.
      environment:
        title: Environment Variables
        helper: >-
          Enter one variable per line, for example appKeyId=xxxxx. See the [Lego
          DNS documentation](https://go-acme.github.io/lego/dns/) for required
          variables.
      legoEabAccessId:
        title: EAB Credentials
        helper: Select EAB credentials if required by your certificate authority.
      customArgs:
        title: Custom Lego Global Options
        helper: >-
          Additional Lego global command-line options. See the [Lego CLI
          documentation](https://go-acme.github.io/lego/usage/cli/options/).
      customCommandOptions:
        title: Custom Lego Run Options
        helper: >-
          Additional options for the Lego run command. See the [Lego CLI
          documentation](https://go-acme.github.io/lego/usage/cli/options/).
      privateKeyType:
        title: Key Algorithm
        helper: Keep the default unless needed.
      pfxPassword:
        title: Certificate Encryption Password
        helper: >-
          Choose whether to encrypt PFX and JKS certificates. If omitted, PFX
          uses an empty password and JKS uses 123456.
      pfxArgs:
        title: PFX Conversion Options
        component:
          optionsMapping:
            '': Latest Windows Server compatibility
            '-macalg SHA1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES': Windows Server 2016 compatibility
            '-nomac -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES': Windows Server 2008 compatibility
        helper: Options for compatibility with different Windows Server versions.
    output:
      cert:
        title: Domain Certificate
      certMd5:
        title: Certificate MD5
input:
  domains:
    title: 证书域名
    component:
      name: domain-selector
      vModel: value
      mode: tags
      placeholder: >-
        请输入证书域名/IP，比如：foo.com , *.foo.com , *.sub.foo.com , *.bar.com ,
        123.123.123.123
      tokenSeparators:
        - ','
        - ' '
        - ，
        - 、
        - '|'
      search: true
      pager: true
    rules:
      - type: domains
    required: true
    col:
      span: 24
    order: -999
    helper: |-
      1、支持多个域名打到一个证书上，例如： foo.com，*.foo.com，*.bar.com
      2、子域名被通配符包含的不要填写，例如：www.foo.com已经被*.foo.com包含，不要填写www.foo.com
      3、泛域名只能通配*号那一级（*.foo.com的证书不能用于foo.com且不能用于xxx.yyy.foo.com）
      4、输入一个，空格之后，再输入下一个 
      5、如果设置了子域托管解析（比如免费的二级域名托管在CF或者阿里云），请先[设置托管子域名](#/certd/pipeline/subDomain)
  email:
    title: 邮箱
    component:
      name: email-selector
      vModel: value
    rules:
      - type: email
        message: 请输入正确的邮箱
    required: true
    order: -1
    helper: 请输入邮箱
  dnsType:
    title: DNS类型
    component:
      name: a-input
      vModel: value
      placeholder: alidns
    helper: 你的域名是通过哪家提供商进行解析的，具体应该配置什么请参考lego文档：https://go-acme.github.io/lego/dns/
    required: true
    order: 0
  environment:
    title: 环境变量
    component:
      name: a-textarea
      vModel: value
      rows: 4
      placeholder: |-
        ALICLOUD_ACCESS_KEY=abcdefghijklmnopqrstuvwx
        ALICLOUD_SECRET_KEY=your-secret-key
    required: true
    helper: 一行一条，例如 appKeyId=xxxxx，具体配置请参考lego文档：https://go-acme.github.io/lego/dns/
    order: 0
  legoEabAccessId:
    title: EAB授权
    component:
      name: access-selector
      type: eab
    helper: 如果需要提供EAB授权
    order: 0
  customArgs:
    title: 自定义LEGO全局参数
    component:
      name: a-input
      vModel: value
      placeholder: '--dns-timeout 30'
    helper: 额外的lego全局命令行参数，参考文档：https://go-acme.github.io/lego/usage/cli/options/
    maybeNeed: true
    order: 0
  customCommandOptions:
    title: 自定义LEGO签名参数
    component:
      name: a-input
      vModel: value
      placeholder: '--no-bundle'
    helper: 额外的lego签名命令行参数，参考文档：https://go-acme.github.io/lego/usage/cli/options/
    maybeNeed: true
    order: 0
  privateKeyType:
    title: 加密算法
    value: ec256
    component:
      name: a-select
      vModel: value
      options:
        - value: rsa2048
          label: RSA 2048
        - value: rsa3072
          label: RSA 3072
        - value: rsa4096
          label: RSA 4096
        - value: rsa8192
          label: RSA 8192
        - value: ec256
          label: EC 256
        - value: ec384
          label: EC 384
    helper: 如无特殊需求，默认即可
    required: true
    order: 0
  pfxPassword:
    title: 证书加密密码
    component:
      name: input-password
      vModel: value
    required: false
    order: 100
    helper: |-
      转换成PFX、jks格式证书是否需要加密
      不传则pfx格式默认空密码，jks格式默认123456
  pfxArgs:
    title: PFX证书转换参数
    value: '-macalg SHA1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
    component:
      name: a-auto-complete
      vModel: value
      options:
        - value: ''
          label: 兼容 Windows Server 最新
        - value: '-macalg SHA1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
          label: 兼容 Windows Server 2016
        - value: '-nomac -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
          label: 兼容 Windows Server 2008
    required: false
    order: 100
    maybeNeed: true
    helper: 兼容Windows Server各个版本
  renewDays:
    title: 更新天数
    value: 20
    component:
      name: a-input-number
      vModel: value
    required: true
    order: 100
    helper: 到期前多少天后更新证书，注意：流水线默认不会自动运行，请设置定时器，每天定时运行本流水线
  successNotify:
    title: 证书申请成功通知
    value: false
    component:
      name: a-switch
      vModel: checked
    order: 100
    maybeNeed: true
    helper: 证书申请成功后是否发送通知，优先使用默认通知渠道
output:
  cert:
    title: 域名证书
    type: cert
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-cert/plugin/cert-plugin/lego/index.js
