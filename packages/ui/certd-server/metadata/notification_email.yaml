name: email
title: 电子邮件
desc: 电子邮件通知
i18n:
  en-US:
    title: Email Notification
    desc: Send pipeline notifications by email.
    input:
      receivers:
        title: Recipient Email Addresses
        helper: >-
          Enter multiple addresses, pressing Enter after each one. Configure the
          mail server first in Settings > Email.
order: -100
input:
  receivers:
    title: 收件人邮箱
    component:
      name: email-selector
      vModel: value
      mode: tags
    required: true
    helper: |-
      可以填写多个，填写一个按回车键再填写下一个
      需要先[配置邮件服务器](#/sys/settings/email)
pluginType: notification
type: builtIn
scriptFilePath: /plugins/plugin-notification/email/index.js
