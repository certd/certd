name: yidun
title: 易盾DCDN授权
icon: material-symbols:shield-outline
desc: https://user.yiduncdn.com
i18n:
  en-US:
    title: Yidun Access
    input:
      apiKey:
        title: API Key
        helper: Enable API access in the Yidun console and copy the API key.
      apiSecret:
        title: API Secret
        helper: Enable API access in the Yidun console and copy the API secret.
      testRequest:
        title: Test
        helper: Test the API connection.
input:
  apiKey:
    title: api_key
    component:
      placeholder: api_key
    helper: http://user.yiduncdn.com/console/index.html#/account/config/api,点击开启后获取
    required: true
    encrypt: true
  apiSecret:
    title: api_secret
    component:
      placeholder: api_secret
    helper: http://user.yiduncdn.com/console/index.html#/account/config/api,点击开启后获取
    required: true
    encrypt: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: onTestRequest
    helper: 点击测试接口看是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-plus/yidun/access.js
