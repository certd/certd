name: xinnet
title: 新网授权
icon: svg:icon-xinnet
desc: ''
i18n:
  en-US:
    title: Xinnet Access
    desc: Xinnet IAM access.
input:
  username:
    title: 用户名
    component:
      placeholder: 手机号/用户名
    required: true
    encrypt: true
  password:
    title: 登录密码
    component:
      name: a-input-password
      vModel: value
      placeholder: 登录密码
    required: true
    encrypt: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: |-
      测试前请务必先在新网后台关闭异地登录保护、关闭动态口令验证
      如果提示需要短信验证码，请等几个小时后再试
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-xinnet/access.js
