showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: WangsuRefreshCert
title: 网宿-更新证书
desc: 网宿证书自动更新，注意：仅支持普通CDN证书更新，CDN pro的证书请安装在线插件“网宿-CDNPro更新证书”
icon: svg:icon-wangsu
group: cdn
needPlus: false
i18n:
  en-US:
    title: Wangsu-Refresh Cert Plugin
    desc: Refresh Wangsu certificates.
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    order: 0
  certDomains:
    title: 当前证书域名
    component:
      name: cert-domains-getter
    mergeScript: |2-

              return {
                component:{
                    inputKey: ctx.compute(({form})=>{
                      return form.cert
                    }),
                }
              }
              
    template: false
    required: false
    order: 0
  accessId:
    title: 网宿授权
    component:
      name: access-selector
      type: wangsu
    required: true
    order: 0
  certList:
    title: 证书Id
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetCertList
      search: false
      pager: false
      single: false
      watches:
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 要更新的网宿证书id
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-wangsu/plugins/plugin-refresh-cert.js
