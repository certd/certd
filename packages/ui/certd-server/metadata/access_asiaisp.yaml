name: asiaisp
title: 橙域网络(asia-isp)授权
desc: 橙域网络CDN API授权，用于部署证书到橙域CDN
icon: clarity:plugin-line
input:
  accessKeyId:
    title: AccessKeyId
    component:
      placeholder: 请输入 AccessKeyId
    required: true
  accessKeySecret:
    title: AccessKeySecret
    component:
      placeholder: 请输入 AccessKeySecret
    required: true
    encrypt: true
  testRequest:
    title: 测试连接
    component:
      name: api-test
      action: TestRequest
    helper: 点击测试接口是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-asiaisp/access.js
