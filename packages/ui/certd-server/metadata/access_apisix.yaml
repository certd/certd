name: apisix
title: APISIX授权
desc: ''
icon: svg:icon-lucky
i18n:
  en-US:
    title: Apisix Access
    input:
      endpoint:
        title: APISIX endpoint
        helper: APISIX Admin API address
      apiKey:
        title: API key
        helper: Configure the Admin API key in APISIX
      version:
        title: Version
        helper: APISIX system version
        optionsMapping:
          '2': v2.x
          '3': v3.x
      testRequest:
        title: Test
        helper: Test whether the API is available
input:
  endpoint:
    title: Apisix管理地址
    component:
      placeholder: http://192.168.11.11:9180
    required: true
  apiKey:
    title: ApiKey
    component:
      placeholder: ApiKey
    helper: >-
      [参考文档](https://apisix.apache.org/docs/apisix/admin-api/#using-environment-variables)在config中配置admin
      apiKey
    required: true
    encrypt: true
  version:
    title: 版本
    component:
      name: a-select
      options:
        - label: v3.x
          value: '3'
        - label: v2.x
          value: '2'
    helper: apisix系统的版本
    value: '3'
    required: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: 点击测试接口是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-apisix/access.js
