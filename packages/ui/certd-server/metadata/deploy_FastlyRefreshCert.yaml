showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: FastlyRefreshCert
title: Fastly-更新证书
desc: 自动更新 Fastly CDN 上的已有自定义证书
icon: simple-icons:fastly
group: cdn
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    required: true
    order: 0
  accessId:
    title: Access授权
    helper: Fastly 授权凭证
    component:
      name: access-selector
      type: fastly
    required: true
    order: 0
  certList:
    title: 证书列表
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetCertList
      search: false
      pager: false
      single: false
      watches:
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: >-
      选择要更新的 Fastly 证书 (必须是已存在的自定义证书)。注意：Fastly
      要求更新后的证书与原证书使用相同私钥，请确保续期时复用私钥(reuse key)，否则更新会失败。
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-fastly/plugins/plugin-refresh-cert.js
