showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: FastlyPurgeCache
title: Fastly-清除缓存
desc: 清除 Fastly 指定 Service 的所有缓存 (Purge All)
icon: simple-icons:fastly
group: cdn
input:
  accessId:
    title: Access授权
    helper: Fastly 授权凭证
    component:
      name: access-selector
      type: fastly
    required: true
    order: 0
  serviceId:
    title: Service (服务)
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetServiceList
      search: false
      pager: false
      single: false
      watches:
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 选择要清理所有缓存的 Fastly 服务
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-fastly/plugins/plugin-purge-cache.js
