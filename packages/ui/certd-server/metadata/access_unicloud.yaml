name: unicloud
title: uniCloud
icon: material-symbols:shield-outline
desc: unicloud授权
i18n:
  en-US:
    title: Unicloud Access
    input:
      username:
        title: Account
        helper: UniCloud login email.
      password:
        title: Password
      testRequest:
        title: Test
        helper: Test the API connection.
input:
  email:
    title: 账号
    component:
      placeholder: email
    helper: 登录邮箱
    required: true
    encrypt: false
  password:
    title: 密码
    component:
      placeholder: 密码
    required: true
    encrypt: true
  testRequest:
    title: 测试
    component:
      name: api-test
      action: onTestRequest
    helper: 点击测试接口看是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-plus/unicloud/access.js
