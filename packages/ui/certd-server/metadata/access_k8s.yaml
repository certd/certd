name: k8s
title: k8s授权
desc: ''
icon: mdi:kubernetes
i18n:
  en-US:
    title: K8S - Access
    input:
      kubeconfig:
        title: Kubeconfig
        helper: Kubernetes cluster configuration.
      skipTLSVerify:
        title: Skip TLS Verification
        helper: Skip TLS certificate verification when connecting to the cluster.
      testRequest:
        title: Test
        helper: Test whether the Kubernetes connection works.
input:
  kubeconfig:
    title: kubeconfig
    component:
      name: a-textarea
      vModel: value
      placeholder: kubeconfig
    required: true
    encrypt: true
  skipTLSVerify:
    title: 忽略证书校验
    component:
      name: a-switch
      vModel: checked
    required: false
    encrypt: false
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: 点击测试接口看是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-plus/k8s/access.js
