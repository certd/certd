showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: K8sDeployToSecret
title: K8S-部署证书到Secret
icon: mdi:kubernetes
desc: 部署证书到k8s的secret
needPlus: false
group: panel
i18n:
  en-US:
    title: K8S - Deploy to Secret
    desc: Deploy the certificate to the K8S.
    input:
      namespace:
        title: Namespace
      secretName:
        title: Secret Name
        helper: Name of the Secret storing the certificate.
      accessId:
        title: Kubernetes Access
        helper: Kubeconfig access credentials.
      cert:
        title: Domain Certificate
        helper: Select the certificate output by a previous task.
      ingressName:
        title: Ingress Name
        helper: Optional Ingress to restart after updating the Secret.
      createOnNotFound:
        title: Create Secret Automatically
        helper: Create the Secret when it does not exist.
input:
  namespace:
    title: 命名空间
    value: default
    component:
      placeholder: 命名空间
    required: true
    order: 0
  secretName:
    title: 保密字典Id
    component:
      name: a-select
      vModel: value
      mode: tags
      open: false
    helper: 原本存储证书的secret的name
    required: true
    order: 0
  accessId:
    title: k8s授权
    helper: kubeconfig
    component:
      name: access-selector
      type: k8s
    required: true
    order: 0
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    required: true
    order: 0
  ingressName:
    title: ingress名称
    required: false
    helper: 填写之后会自动重启ingress
    component:
      name: a-select
      vModel: value
      mode: tags
      open: false
    order: 0
  createOnNotFound:
    title: Secret自动创建
    helper: 如果Secret不存在，则创建
    value: false
    component:
      name: a-switch
      vModel: checked
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-plus/k8s/plugins/plugin-secret.js
