showRunStrategy: false
default:
  strategy:
    runStrategy: 0
name: CertApplyLocalCa
icon: ph:seal-check
title: 本地CA证书申请
group: cert
desc: 使用本地中间CA签发证书，无需域名验证；客户端需信任根CA，建议用于内部/测试环境
i18n:
  en-US:
    title: Request Certificate (Local CA)
    desc: >-
      Issue certificates from your own local root CA without domain validation.
      Clients must trust the root CA; recommended for internal/testing
      environments.
    input:
      caId:
        title: Intermediate CA
        helper: >-
          Select an intermediate CA. Leaf certificates are issued by it, and the
          root CA must be trusted.
      keyType:
        title: Key Type
      validityDays:
        title: Validity (Days)
        helper: Capped by the CA's remaining validity.
      renewDays:
        title: Renew Before (Days)
        helper: Reissue when the current certificate expires within this window.
input:
  caId:
    title: 中间CA
    helper: 选择中间CA；叶子证书由该CA签发，客户端需要信任其根CA
    component:
      name: local-ca-selector
      vModel: modelValue
    required: true
    order: -9999
  domains:
    title: 证书域名
    component:
      name: domain-selector
      vModel: value
      mode: tags
      placeholder: >-
        请输入证书域名/IP，比如：foo.com , *.foo.com , *.sub.foo.com , *.bar.com ,
        123.123.123.123
      tokenSeparators:
        - ','
        - ' '
        - ，
        - 、
        - '|'
      search: true
      pager: true
    mergeScript: |-
      return {
            component: {
              caId: ctx.compute(({ form }) => form.caId)
            }
          }
    rules:
      - type: domains
    required: true
    col:
      span: 24
    order: -999
    helper: |-
      1、支持多个域名打到一个证书上，例如： foo.com，*.foo.com，*.bar.com
      2、子域名被通配符包含的不要填写，例如：www.foo.com已经被*.foo.com包含，不要填写www.foo.com
      3、泛域名只能通配*号那一级（*.foo.com的证书不能用于foo.com且不能用于xxx.yyy.foo.com）
      4、输入一个，空格之后，再输入下一个
      5、如果设置了子域托管解析（比如免费的二级域名托管在CF或者阿里云），请先[设置托管子域名](#/certd/pipeline/subDomain)
  keyType:
    title: 密钥类型
    value: rsa2048
    component:
      name: a-select
      vModel: value
      options:
        - value: rsa2048
          label: RSA 2048
        - value: rsa3072
          label: RSA 3072
        - value: rsa4096
          label: RSA 4096
        - value: ecdsa256
          label: ECDSA P-256
        - value: ecdsa384
          label: ECDSA P-384
    required: true
    order: 90
  validityDays:
    title: 证书有效期(天)
    value: 365
    helper: 实际有效期不会超过CA证书的剩余有效期
    component:
      name: a-input-number
      vModel: value
      min: 1
      max: 3650
    required: true
    order: 91
  renewDays:
    title: 提前更新天数
    value: 20
    helper: 当前证书距离过期小于该天数时重新签发
    component:
      name: a-input-number
      vModel: value
      min: 1
      max: 3650
    required: true
    order: 92
  pfxPassword:
    title: 证书加密密码
    component:
      name: input-password
      vModel: value
    required: false
    order: 100
    helper: |-
      转换成PFX、jks格式证书是否需要加密
      不传则pfx格式默认空密码，jks格式默认123456
  pfxArgs:
    title: PFX证书转换参数
    value: '-macalg SHA1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
    component:
      name: a-auto-complete
      vModel: value
      options:
        - value: ''
          label: 兼容 Windows Server 最新
        - value: '-macalg SHA1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
          label: 兼容 Windows Server 2016
        - value: '-nomac -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES'
          label: 兼容 Windows Server 2008
    required: false
    order: 100
    maybeNeed: true
    helper: 兼容Windows Server各个版本
output:
  cert:
    title: 域名证书
    type: cert
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-cert/plugin/cert-plugin/local-ca/index.js
