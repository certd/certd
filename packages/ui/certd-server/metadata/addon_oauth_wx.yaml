addonType: oauth
name: wx
title: 微信登录
desc: 微信网站应用登录
i18n:
  en-US:
    title: WeChat OAuth
    desc: Sign in with a WeChat account.
    input:
      appId:
        title: App ID
        helper: >-
          Create a website application in the WeChat Open Platform and enter its
          App ID.
      appSecretKey:
        title: App Secret
icon: ion:logo-wechat:green
showTest: false
input:
  appId:
    title: AppId
    required: true
    helper: 在[微信开放平台](https://open.weixin.qq.com/cgi-bin/index)注册网站应用后获取
  appSecretKey:
    title: AppSecretKey
    component:
      placeholder: AppSecretKey
    required: true
pluginType: addon
type: builtIn
scriptFilePath: /plugins/plugin-oauth/wx/plugin-wx.js
