name: aliyun
title: 阿里云授权
desc: ''
i18n:
  en-US:
    title: Aliyun Access
    desc: Configure Aliyun access credentials.
icon: ant-design:aliyun-outlined
order: 0
input:
  accessKeyId:
    title: accessKeyId
    component:
      placeholder: accessKeyId
    helper: 登录阿里云控制台->AccessKey管理页面获取。
    required: true
  accessKeySecret:
    title: accessKeySecret
    component:
      placeholder: accessKeySecret
    required: true
    encrypt: true
    helper: 注意：证书申请需要dns解析权限；其他阿里云插件，需要对应的权限，比如证书上传需要证书管理权限；嫌麻烦就用主账号的全量权限的accessKey
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: 点击测试接口是否正常
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-lib/aliyun/access/aliyun-access.js
