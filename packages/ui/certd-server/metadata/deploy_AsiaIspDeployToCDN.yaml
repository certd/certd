showRunStrategy: false
default:
  strategy:
    runStrategy: 1
name: AsiaIspDeployToCDN
title: 橙域网络-部署证书到CDN
desc: 部署证书到橙域网络(asia-isp) CDN加速域名
icon: clarity:plugin-line
group: cdn
input:
  cert:
    title: 域名证书
    helper: 请选择前置任务输出的域名证书
    component:
      name: output-selector
      from:
        - ':cert:'
    required: true
    order: 0
  certDomains:
    title: 当前证书域名
    component:
      name: cert-domains-getter
    mergeScript: |2-

              return {
                component:{
                    inputKey: ctx.compute(({form})=>{
                      return form.cert
                    }),
                }
              }
              
    template: false
    required: false
    order: 0
  accessId:
    title: 橙域网络授权
    component:
      name: access-selector
      type: asiaisp
    required: true
    order: 0
  domainList:
    title: 加速域名
    component:
      name: remote-select
      vModel: value
      mode: tags
      type: plugin
      action: onGetDomainList
      search: true
      pager: true
      single: false
      pageSize: 10
      watches:
        - certDomains
        - accessId
        - certDomains
        - accessId
    required: true
    mergeScript: |2-

                return {
                  component:{
                    form: ctx.compute(({form})=>{
                      return form
                    })
                  },
               }
              
    helper: 选择要部署证书的橙域CDN加速域名
    order: 0
output: {}
pluginType: deploy
type: builtIn
scriptFilePath: /plugins/plugin-asiaisp/plugin-deploy-to-cdn.js
