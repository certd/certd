name: fastly
title: Fastly授权
icon: simple-icons:fastly
desc: Fastly CDN / TLS Custom Certificates API 授权
input:
  apiKey:
    title: API Token
    component:
      placeholder: Fastly API Key / Token
    helper: 前往 Fastly Account Settings -> Personal Access Tokens 创建 Token
    required: true
    encrypt: true
  proxy:
    title: HTTP代理
    component:
      placeholder: http://xxxx.xxx.xx:10811
    helper: 可选：是否使用 HTTP 代理访问 Fastly API
    required: false
    encrypt: false
  testRequest:
    title: 测试
    component:
      name: api-test
      action: TestRequest
    helper: 测试授权是否正确
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-fastly/access.js
