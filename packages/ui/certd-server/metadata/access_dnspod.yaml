name: dnspod
title: dnspod(已废弃)
desc: 腾讯云的域名解析接口已迁移到dnspod
i18n:
  en-US:
    title: DNSPod
    desc: DNSPod access (deprecated).
deprecated: dnspod已废弃，请换成腾讯云
icon: svg:icon-tencentcloud
input:
  endpoint:
    title: 端点
    component:
      placeholder: endpoint
      name: a-auto-complete
      vModel: value
      options:
        - value: https://dnsapi.cn
          label: 中国站
        - value: https://api.dnspod.com
          label: 国际站
    rules:
      - required: true
        message: 该项必填
  id:
    title: ID
    component:
      placeholder: dnspod token 的 id
    rules:
      - required: true
        message: 该项必填
  token:
    title: token
    component:
      placeholder: 开放接口token
    encrypt: true
    rules:
      - required: true
        message: 该项必填
pluginType: access
type: builtIn
scriptFilePath: /plugins/plugin-tencent/access/dnspod-access.js
